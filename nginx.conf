server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx listens on 8080 behind the LB/CDN, so self-built absolute
    # redirect URLs would leak "http://host:8080/..." to browsers. Emit
    # path-only Location headers instead.
    absolute_redirect off;
    port_in_redirect off;

    # Serve pre-compressed variants when present (scripts/compress.js emits .zst
    # at level 12, .br at --best, and .gz). Preference order for a client that
    # advertises several encodings: zstd > brotli > gzip. The zstd + brotli
    # static modules are compiled into the image and load_module'd in the main
    # nginx.conf (see deploy/Dockerfile) — without them the .zst/.br files were
    # built but never served, so users got gzip (DPT-252).
    zstd_static on;
    brotli_static on;
    gzip_static on;

    # Dynamic zstd for responses that have no pre-compressed sibling (rare on a
    # static SPA, but keeps proxied/generated responses compressed). Level 12
    # matches the build-time .zst level. brotli/gzip dynamic are intentionally
    # left off — static SPA assets are all pre-compressed at build time.
    zstd on;
    zstd_comp_level 12;
    zstd_min_length 256;

    # --- SPA control files: ALWAYS revalidate, never let an edge cache them ---
    # This is why we serve via nginx instead of a DO static site: a static site
    # hard-codes Cache-Control: public,max-age=10,s-maxage=86400 on these files,
    # which strands users on a stale build for up to 24h after a deploy. no-cache
    # makes Cloudflare/DO CDN revalidate every request (cf-cache-status BYPASS),
    # so a freshly deployed version is delivered immediately.
    location = /index.html   { add_header Cache-Control "no-cache, must-revalidate" always; }
    location = /sw.js        { add_header Cache-Control "no-cache, must-revalidate" always; add_header Service-Worker-Allowed "/" always; }
    location = /version.json { add_header Cache-Control "no-cache, must-revalidate" always; default_type application/json; }
    location = /manifest.json{ add_header Cache-Control "no-cache, must-revalidate" always; }

    # --- Content-addressed (hashed) assets: immutable, cache for a year ---
    # '^~' so this prefix beats the regex media block below (in nginx a regex
    # location otherwise outranks a plain prefix), keeping CDN performance.
    location ^~ /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # --- Other static media (non-hashed icons/images/fonts): moderate cache ---
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|svg|ico|gif|webp)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # --- Nova bundle (DEVO-135): /nova/ is an independent SPA -------------------
    # /nova/ is the nova channel's release NAME (src/utils/release-names.ts);
    # the path renames when the release names rotate. A `nova` org is
    # redirected (post-login, same-origin) to /nova/, served from the pinned
    # nova build placed at ./nova/ during CI assembly. Mirrors the root
    # rules: control files revalidate, hashed assets are immutable, and
    # /nova/* history-falls-back to /nova/index.html. nginx picks the longest
    # matching prefix, so `location /nova/` beats `location /`; `^~` on the
    # assets prefix beats the regex media block for /nova/assets/*.
    location = /nova/index.html    { add_header Cache-Control "no-cache, must-revalidate" always; }
    location = /nova/version.json  { add_header Cache-Control "no-cache, must-revalidate" always; default_type application/json; }
    location = /nova/sw.js         { add_header Cache-Control "no-cache, must-revalidate" always; add_header Service-Worker-Allowed "/nova/" always; }
    location = /nova/manifest.json { add_header Cache-Control "no-cache, must-revalidate" always; }
    location ^~ /nova/assets/      { add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /nova/ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri /nova/index.html;
    }

    # Legacy paths: `frozen` is retired (DEVO-135) — every org that was pinned
    # to it is now on `vesta` (the normal root bundle), so both the old
    # /frozen/ pinned-bundle path and the newer /vesta/ pinned-bundle path are
    # dead. Bookmarks/service workers pointing at either still exist, so send
    # them to the root SPA instead of a 404.
    location = /frozen  { return 301 /; }
    location /frozen/ {
        rewrite ^/frozen/(.*)$ /$1 permanent;
    }
    location = /vesta  { return 301 /; }
    location /vesta/ {
        rewrite ^/vesta/(.*)$ /$1 permanent;
    }

    # --- SPA history fallback ---
    # Root-level files not matched above (e.g. robots.txt) get a modest default
    # so they aren't left to CDN heuristic caching. index.html / SPA routes are
    # unaffected: try_files internally redirects to /index.html, which re-matches
    # the exact `= /index.html` no-cache block above.
    #
    # NOTE: deliberately NO `$uri/` here. An SPA never serves directory indexes,
    # and `$uri/` makes nginx 301-redirect any route that collides with a real
    # asset directory to a trailing slash, then 403 (directory, no index,
    # autoindex off). This bit us when a route like /settings collided with the
    # public/settings/ asset folder. Routes must always fall through to
    # index.html, so we only try the exact file then the SPA shell.
    location / {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri /index.html;
    }
}
